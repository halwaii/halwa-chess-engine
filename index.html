<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halwa Engine Setup</title>
    <link rel="stylesheet" href="chessboard/chessboard-1.0.0.min.css">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #2c2c2c; color: white; padding: 20px; }
        #myBoard { width: 500px; margin: 20px auto; }
        
        .stats-banner { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: inline-block; }
        .stats-banner span { font-weight: bold; color: #4CAF50; margin: 0 10px; }
        .controls button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #4CAF50; border: none; color: white; border-radius: 5px; font-weight: bold;}
        .controls button:hover { background: #45a049; }
    </style>
</head>
<body>

    <h2>Halwa</h2>
    
    <!-- Stats Banner -->
    <div class="stats-banner">
        Visits: <span id="visitCount">0</span> | 
        Games: <span id="gameCount">0</span> | 
        Engine Wins: <span id="winCount">0</span> | 
        Draws: <span id="drawCount">0</span>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button onclick="startNewGame('white')">Play as White</button>
        <button onclick="startNewGame('black')">Play as Black</button>
        <button onclick="downloadPGN()">Download PGN</button>

        <a href="https://github.com/jay-xlr8/halwa-chess-engine" target="_blank">
            <button style="background-color: #24292e;">⭐ GitHub</button>
        </a>
    </div>
    
    <div id="myBoard"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="chessboard/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <script src="script.js"></script>
</body>
</html>
